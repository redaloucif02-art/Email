# À placer dans le repo : .github/workflows/analyze.yml
# À la racine du repo : contacts.jsonl et analyze_contacts.py
# Secret requis : CEREBRAS_API_KEYS (une clé par ligne)
name: Analyse IA des contacts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre d'agences à traiter (30 = test rapide, 0 = toutes)"
        default: "30"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Analyser avec gpt-oss-120b
        env:
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
        run: timeout 6600 python analyze_contacts.py contacts.jsonl -o enriched.jsonl --limit ${{ inputs.limit }} --batch 12 --workers 6 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enriched
          path: enriched.jsonl
          retention-days: 30
