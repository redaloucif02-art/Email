# À placer dans le repo : .github/workflows/analyze.yml
# À la racine du repo : contacts.jsonl et analyze_contacts.py
# Secret requis : CEREBRAS_API_KEYS (une clé par ligne, toutes tes clés)
# Reprise automatique : enriched.jsonl est enregistré dans le repo à la fin de chaque run (repo PRIVÉ obligatoire).
name: Analyse IA des contacts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre d'agences à traiter (30 = test rapide, 0 = toutes)"
        default: "0"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Analyser avec gpt-oss-120b (toutes les clés en alternance)
        env:
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
        run: timeout 20400 python analyze_contacts.py contacts.jsonl -o enriched.jsonl --limit ${{ inputs.limit }} --batch 12 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enriched
          path: enriched.jsonl
          retention-days: 30

      - name: Sauvegarder enriched.jsonl dans le repo (pour la reprise)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add enriched.jsonl
          git commit -m "enriched.jsonl : $(wc -l < enriched.jsonl) lignes" || echo "rien à sauvegarder"
          git push || echo "push impossible"
